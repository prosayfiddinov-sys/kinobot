services:
  - type: worker
    name: kinobot
    runtime: python
    rootDir: kinobot_python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: MOVIE_CHANNEL
        sync: false
      - key: REQUIRED_CHANNELS
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: WELCOME_PHOTO
        sync: false
